name: Restful-Booker CI Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/workflows/monitor.yml'
  pull_request:
    branches: [ main ]

jobs:
  api-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Kiểm tra file có tồn tại không
        run: ls -la

      - name: 3. Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 4. Cài đặt Newman
        run: npm install -g newman

      - name: 5. Chạy bộ Test tự động
        run: >
          newman run RestfulBooker.postman_collection.json
          -e RestfulBooker.postman_environment.json
          -d booking_data.csv
          --delay-request 200
          --timeout-request 10000
          --reporters cli
